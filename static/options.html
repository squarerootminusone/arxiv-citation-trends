<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Citation Trends options</title>
  <style>
    body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 16px; min-width: 360px; color: #222; background: #fff; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
    p { color: #555; margin: 6px 0 12px; }
    button { font: inherit; padding: 4px 12px; margin-right: 6px; }
    #status { margin-left: 4px; color: #116329; }
  </style>
</head>
<body>
  <label for="key">Semantic Scholar API key (optional)</label>
  <input id="key" type="password" autocomplete="off" spellcheck="false">
  <p>Without a key, requests share an anonymous rate limit and papers can take several seconds to load.
     Keys are free from <a href="https://www.semanticscholar.org/product/api#api-key-form" target="_blank" rel="noopener">semanticscholar.org</a>.</p>
  <button id="save">Save</button>
  <button id="clear">Clear cached citations</button>
  <span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
